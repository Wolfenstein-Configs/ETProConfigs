//ARTY
//--------------------------------------------------------------------------------------
unbind b
bind b "+vstr arty1 arty2"
set arty1 "+zoom;vstr artyon"
set arty2 "-zoom;vstr artyoff"
set artyon "bind MOUSE1 vstr artycall"
set artyoff "bind MOUSE1 +attack"
set artycall "+attack;cmd vsay_team FireInTheHole ^0=bb^7Arty;-attack"

//NAME
//--------------------------------------------------------------------------------------
seta name ^wAziMiZ^0>^z>^wKapoks

set x4 "name ^wAziMiZ^0>^z>^wKapoks; set nick vstr x5"
set x5 "name ^wAziMiZ^0#^wKapoks; set nick vstr x6"
set x6 "name ^9AziMiZ^0>^7>^9Kapoks; set nick vstr x4"

set nick "vstr x4"
bind o "vstr nick "

//RECORD
//--------------------------------------------------------------------------------------
bind f12 "vstr demor"
set demoon "autorecord;cmd  say ^0=bb^7Recording; set demor vstr demooff"
set demooff "stoprecord;cmd say ^0=bb^7Stopped Recording; set demor vstr demoon"
set demor "vstr demoon"
F11 "autoscreenshot.jpg"

// VOTES
//--------------------------------------------------------------------------------------
bind f2 "vote no;vsay yes"
bind f1 "vote yes;vsay no"
bind f3 "ready;cmd say ^0=bb^7Ready"

bind z "setspawnpt 4;cmd say_team ^0=bb^7Sp 4"

//Class Selection Script 
//-------------------------------------------------
bind F5"class m 1;cmd vsay_team iammedic ^0=bb^7MdC"
bind F6"class f 1;cmd vsay_team iamfieldops ^0=bb^7FdO"
bind F7"vstr engi"
bind F8"vstr cop"
bind F9"vstr sol"
seta engi"vstr eng1"
seta eng1"class e 1;cmd vsay_team iamengineer ^0=bb^7SmG;set engi vstr eng2"
seta eng2"class e 2;cmd vsay_team iamengineer ^0=bb^7RfL;set engi vstr eng1"
seta cop"vstr cop1"
seta cop1"class c 1;cmd vsay_team iamcovertops ^0=bb^7StN;set cop vstr cop2"
seta cop2"class c 3;cmd vsay_team iamcovertops ^0=bb^7K43;set cop vstr cop1"
seta sol1 "class s 4;cmd vsay_team iamsoldier ^0=bb^wPnZ;set sol vstr sol2"
seta sol2 "class s 2;cmd vsay_team iamsoldier ^0=bb^wM42;set sol vstr sol3"
seta sol3 "class s 3;cmd vsay_team iamsoldier ^0=bb^wFlM;set sol vstr sol1"



